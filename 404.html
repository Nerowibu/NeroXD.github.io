<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <!-- Mengambil ikon sosial media FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="error-page-body">

    <!-- Konten Utama Tengah -->
    <main class="error-main-content">
        <h1 class="error-large-title">404</h1>
        <p class="error-subtitle-text font-mono">Sorry, the page you are looking for does not exist.</p>
        <a href="index.html" class="error-back-btn font-mono">Go back home ↗</a>
    </main>

    <!-- Bagian Footer Kustom Detil Sesuai Gambar -->
    <footer class="error-custom-footer font-mono">
        <div class="error-footer-left">
            <span class="error-user-tag">~/neroxd</span>
            <span class="error-tagline">Built with curiosity.</span>
            <!-- Widget Visitor Counter Aktif -->
            <div class="error-visitor">
                <i class="fa-regular fa-eye"></i> 
                <img src="https://glitch.me" alt="Visitor Counter" class="error-counter-digits"> 
                <span>visitors today</span>
            </div>
        </div>

        <!-- Ikon Sosial Media Pojok Kanan Bawah -->
        <div class="error-footer-right">
            <a href="https://github.com" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
            <!-- Ganti dengan link Discord Anda sendiri -->
            <a href="https://discord.com" target="_blank" title="Discord"><i class="fa-brands fa-discord"></i></a>
        </div>
    </footer>

</body>
</html>
